services:
  db:
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?imposta POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?imposta POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?imposta POSTGRES_DB in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      APP_MODE: ${APP_MODE:-dev}
      API_FOOTBALL_KEY: ${API_FOOTBALL_KEY:-}
    volumes:
      - ./data:/app/data  # cache delle risposte del fornitore, condivisa con gli script locali
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Il worker aggiorna i DATI REALI (database <POSTGRES_DB>_real): import giornaliero dal
    # fornitore secondo API_IMPORT_PLAN, poi calcolo. I dati mock restano nel database principale.
    command: ["sh", "-c", "alembic upgrade head && prospectlens worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}_real
      PIPELINE_HOUR: ${PIPELINE_HOUR:-5}
      API_FOOTBALL_KEY: ${API_FOOTBALL_KEY:-}
      API_IMPORT_PLAN: ${API_IMPORT_PLAN:-}
      API_DAILY_BUDGET: ${API_DAILY_BUDGET:-95}
    volumes:
      - ./data:/app/data
    depends_on:
      api:
        condition: service_healthy  # le migrazioni le esegue l'api all'avvio

volumes:
  pgdata:
